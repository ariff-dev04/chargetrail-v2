server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ {
        proxy_pass http://chargetrail_api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /docs { proxy_pass http://chargetrail_api:8000/docs; proxy_set_header Host $host; }
    location /redoc { proxy_pass http://chargetrail_api:8000/redoc; proxy_set_header Host $host; }
    location /health { proxy_pass http://chargetrail_api:8000/health; proxy_set_header Host $host; }
    location /metrics { proxy_pass http://chargetrail_api:8000/metrics; proxy_set_header Host $host; }
    location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
