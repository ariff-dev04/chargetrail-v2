name: ChargeTrail v2 CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality-gate:
    name: Backend Lint, Test & Verification (FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Ruff Lint Check
        run: |
          cd backend
          ruff check .

      - name: Run Ruff Formatting Check
        run: |
          cd backend
          ruff format --check .

      - name: Run Pytest Test Suite
        run: |
          cd backend
          pytest -v

      - name: Enforce File Size Ceiling (< 500 lines)
        run: |
          python -c "
          import glob, sys
          files = glob.glob('backend/app/**/*.py', recursive=True) + glob.glob('backend/tests/**/*.py', recursive=True)
          oversized = [f for f in files if len(open(f, encoding='utf-8').readlines()) > 500]
          if oversized:
              print('Files exceeding 500 lines:', oversized)
              sys.exit(1)
          print('All backend files strictly under 500 lines.')
          "

  frontend-quality-gate:
    name: Frontend Analyze & Test (Flutter 3.x)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter packages
        run: |
          cd frontend
          flutter pub get

      - name: Run Flutter Analyzer
        run: |
          cd frontend
          flutter analyze

      - name: Run Flutter Test Suite
        run: |
          cd frontend
          flutter test

      - name: Enforce File Size Ceiling (< 500 lines)
        run: |
          python3 -c "
          import glob, sys
          files = glob.glob('frontend/lib/**/*.dart', recursive=True) + glob.glob('frontend/test/**/*.dart', recursive=True)
          oversized = [f for f in files if len(open(f, encoding='utf-8').readlines()) > 500]
          if oversized:
              print('Files exceeding 500 lines:', oversized)
              sys.exit(1)
          print('All frontend files strictly under 500 lines.')
          "
