name: ChargeTrail v2 CI/CD Quality Gate & Homelab Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality-gate:
    name: Backend Lint, Test & Verification (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run Ruff Lint Check
        run: |
          cd backend
          ruff check .
      - name: Run Ruff Formatting Check
        run: |
          cd backend
          ruff format --check .
      - name: Run Pytest Test Suite
        run: |
          cd backend
          pytest -v
      - name: Enforce File Size Ceiling (< 500 lines)
        run: |
          python -c "import glob, sys; files = glob.glob('backend/app/**/*.py', recursive=True) + glob.glob('backend/tests/**/*.py', recursive=True); oversized = [f for f in files if len(open(f, encoding='utf-8').readlines()) > 500]; sys.exit(1) if oversized else print('All backend files under 500 lines.')"

  frontend-quality-gate:
    name: Frontend Analyze, Test & Web Build (Flutter 3.x)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install Flutter packages
        run: |
          cd frontend
          flutter pub get
      - name: Run Flutter Analyzer
        run: |
          cd frontend
          flutter analyze
      - name: Run Flutter Test Suite
        run: |
          cd frontend
          flutter test
      - name: Enforce File Size Ceiling (< 500 lines)
        run: |
          python3 -c "import glob, sys; files = glob.glob('frontend/lib/**/*.dart', recursive=True) + glob.glob('frontend/test/**/*.dart', recursive=True); oversized = [f for f in files if len(open(f, encoding='utf-8').readlines()) > 500]; sys.exit(1) if oversized else print('All frontend files under 500 lines.')"
      - name: Build Production Flutter Web Bundle
        run: |
          cd frontend
          flutter build web --release
      - name: Upload Web Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chargetrail-web-bundle
          path: frontend/build/web/

  deploy-homelab:
    name: Continuous Deployment to Bare-Metal Homelab (homelab-svr)
    needs: [backend-quality-gate, frontend-quality-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'ariff-dev04'
    runs-on: self-hosted
    steps:
      - name: Sync Repository on Homelab
        run: |
          cd /home/arifflabs/chargetrail-v2
          git fetch origin main
          git checkout -f main
          git reset --hard origin/main
          mkdir -p /home/arifflabs/chargetrail-v2/frontend/build/web
      - name: Download Compiled Web Bundle
        uses: actions/download-artifact@v4
        with:
          name: chargetrail-web-bundle
          path: /home/arifflabs/chargetrail-v2/frontend/build/web
      - name: Rebuild Containers & Verify Health
        run: |
          cd /home/arifflabs/chargetrail-v2
          chmod -R a+rX /home/arifflabs/chargetrail-v2/frontend/build/web
          docker compose up -d --build
          sleep 3
          curl -f -s http://127.0.0.1:8086/health
