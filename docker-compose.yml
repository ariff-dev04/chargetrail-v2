services:
  chargetrail_api:
    build: ./backend
    container_name: chargetrail_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - ./backend/chargetrail_local.db:/app/chargetrail_local.db
    networks:
      - chargetrail_internal
      - homelab_ingress

  chargetrail_web:
    build: ./frontend
    container_name: chargetrail_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:80"
    volumes:
      - ./frontend/build/web:/usr/share/nginx/html:ro
    depends_on:
      - chargetrail_api
    networks:
      - chargetrail_internal
      - homelab_ingress

networks:
  chargetrail_internal:
    driver: bridge
  homelab_ingress:
    external: true
